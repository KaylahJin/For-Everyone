<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Book Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Noto+Sans+Thai:wght@100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="stylesheet.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Libre Baskerville", "Noto Sans Thai", serif;
        }

        body {
            display: flex;
            min-height: 100vh;
            background: #f5f1e8;
            color: #403a2a;
            min-height: 100vh;
        }

        /* Main */
        .main-content {
            flex: 1;
            padding: 60px 90px;
        }

        .page-title {
            font-size: 32px;
            margin-bottom: 20px;
        }

        /* Table */
        .orders-table-container {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .orders-table {
            width: 100%;
            border-collapse: collapse;
        }

        .orders-table th {
            background: #f5eebf;
            padding: 16px;
            text-align: left;
            font-weight: 600;
        }

        .orders-table td {
            padding: 16px;
            border-bottom: 1px solid #e6e0cf;
        }

        .orders-table tr:hover {
            background: #fafaf8;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #7a7461;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-complete {
            background: #d4edda;
            color: #155724;
        }

        .status-cancelled {
            background: #f8d7da;
            color: #721c24;
        }

        /* Action buttons */
        .action-cell {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-view {
            padding: 8px 16px;
            background: #B6A88A;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .btn-view:hover {
            background: #a39578;
        }

        .btn-approve {
            padding: 6px 10px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
            transition: background 0.2s;
        }

        .btn-approve:hover {
            background: #218838;
        }

        .btn-reject {
            padding: 6px 10px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
            transition: background 0.2s;
        }

        .btn-reject:hover {
            background: #c82333;
        }

        /* Disable buttons for completed/cancelled orders */
        .btn-approve:disabled,
        .btn-reject:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="profile">
            <img src="img/BlankPF.png" alt="Profile">
            <p>admin</p>
        </div>

        <hr>

        <nav>
            <ul class="nav-menu">
                <li class="nav-item"><a href="booklist.html" class="nav-link">Book List</a></li>
                <li class="nav-item"><a href="addbook.html" class="nav-link">Add New Book</a></li>
                <li class="nav-item"><a href="admin-order-list.html" class="nav-link active">Order List</a></li>
            </ul>
        </nav>

        <button onclick="logout()">Logout</button>
    </div>

    <main class="main-content">
        <h1 class="page-title">ตรวจสอบคำสั่งซื้อและใบเสร็จ</h1>

        <div class="orders-table-container">
            <table class="orders-table">
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Book</th>
                        <th>Time</th>
                        <th>Date</th>
                        <th>Amount</th>
                        <th>Price</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="ordersTableBody">
                    <tr>
                        <td colspan="8" class="empty-state">กำลังโหลดข้อมูล...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        const API_BASE = "http://localhost:8080/api";
        let allOrders = [];
        let usersCache = {};

        async function getUsername(userId) {
            if (usersCache[userId]) return usersCache[userId];
            try {
                const res = await fetch(`${API_BASE}/users/${userId}`);
                if (res.ok) {
                    const user = await res.json();
                    usersCache[userId] = user.username;
                    return user.username;
                }
            } catch { }
            return "User" + userId;
        }

        function formatDate(d) {
            return new Date(d).toLocaleDateString("th-TH");
        }

        function formatTime(d) {
            return new Date(d).toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" });
        }

        function getStatusClass(status) {
            if (status === 'PAID' || status === 'COMPLETE') return 'status-complete';
            if (status === 'CANCELLED') return 'status-cancelled';
            return 'status-pending';
        }

        function getStatusText(status) {
            if (status === 'PAID' || status === 'COMPLETE') return 'Complete';
            if (status === 'CANCELLED') return 'Cancelled';
            return 'Pending';
        }

        async function loadOrders() {
            const body = document.getElementById("ordersTableBody");
            if (!body) return console.error('❌ tbody#ordersTableBody ไม่พบใน DOM');

            try {
                const res = await fetch(`${API_BASE}/orders/admin/list`);
                if (!res.ok) throw new Error("Fetch failed");

                allOrders = await res.json();

                if (!allOrders.length) {
                    body.innerHTML = `<tr><td colspan="8" class="empty-state">ไม่พบคำสั่งซื้อ</td></tr>`;
                    return;
                }

                const rows = await Promise.all(
                    allOrders.map(async o => {
                        const username = o.username || await getUsername(o.userId);
                        const totalQty = o.amount || 0;
                        const isPending = o.status !== 'PAID' && o.status !== 'CANCELLED';
                        const disabledAttr = isPending ? '' : 'disabled';

                        return `
<tr>
  <td>${username}</td>
  <td>${o.book || "-"}</td>
  <td>${o.time || "-"}</td>
  <td>${o.date || "-"}</td>
  <td>${totalQty}</td>
  <td>฿${o.price?.toFixed(0) || 0}</td>
  <td><span class="status-badge ${getStatusClass(o.status)}">${getStatusText(o.status)}</span></td>
  <td>
    <div class="action-cell">
      <button class="btn-approve" onclick="approveOrder(${o.orderId})" ${disabledAttr} title="Approve">✓</button>
      <button class="btn-reject" onclick="rejectOrder(${o.orderId})" ${disabledAttr} title="Cancel">✗</button>
      <a href="admin-checkout.html?orderId=${o.orderId}" class="btn-view" title="View Details">🔍 View</a>
    </div>
  </td>
</tr>`;
                    })
                );

                body.innerHTML = rows.join("");

            } catch (err) {
                console.error('Error loading orders:', err);
                body.innerHTML = `<tr><td colspan="8" class="empty-state">เกิดข้อผิดพลาดในการโหลดข้อมูล</td></tr>`;
            }
        }

        async function approveOrder(orderId) {
            if (!confirm('ยืนยันการอนุมัติคำสั่งซื้อนี้?\nสถานะจะเปลี่ยนเป็น "PAID"')) return;
            try {
                const res = await fetch(`${API_BASE}/orders/${orderId}/status?status=PAID`, { method: 'POST' });
                if (res.ok) {
                    alert('✅ อนุมัติคำสั่งซื้อเรียบร้อยแล้ว');
                    loadOrders();
                } else {
                    const error = await res.text();
                    alert('❌ เกิดข้อผิดพลาด: ' + error);
                }
            } catch (err) {
                console.error('Error approving order:', err);
                alert('❌ ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์');
            }
        }

        async function rejectOrder(orderId) {
            if (!confirm('ยืนยันการยกเลิกคำสั่งซื้อนี้?\nสถานะจะเปลี่ยนเป็น "CANCELLED"')) return;
            try {
                const res = await fetch(`${API_BASE}/orders/${orderId}/status?status=CANCELLED`, { method: 'POST' });
                if (res.ok) {
                    alert('✅ ยกเลิกคำสั่งซื้อเรียบร้อยแล้ว');
                    loadOrders();
                } else {
                    const error = await res.text();
                    alert('❌ เกิดข้อผิดพลาด: ' + error);
                }
            } catch (err) {
                console.error('Error rejecting order:', err);
                alert('❌ ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์');
            }
        }

        function logout() {
            if (confirm('ต้องการออกจากระบบ?')) {
                localStorage.clear();
                window.location.href = "login.html";
            }
        }

        document.addEventListener("DOMContentLoaded", loadOrders);
    </script>
</body>

</html>
